<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Unit29有声预习" />
  <title>Unit 29 碳化合物的命名及物理性质 · 有声互动预习课 | Mastering Chemistry</title>
  <style>
    :root {
      --bg-app: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-sec: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-soft: #eef2ff;

      --teal: #0d9488;
      --teal-soft: #f0fdfa;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --emerald: #059669;
      --emerald-soft: #ecfdf5;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15.5px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 108px;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, #4f46e5, #0d9488);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-sec);
      transition: all 0.15s;
      cursor: pointer;
    }

    .pill-link:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .pill-link.primary-pill {
      background: var(--primary-soft);
      border-color: #c7d2fe;
      color: var(--primary-dark);
    }

    .pill-link.active-unit-pill {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      cursor: default;
      font-weight: 700;
    }

    .ep-strip-wrap {
      max-width: 1440px;
      margin: 14px auto 0;
      padding: 0 18px;
    }

    .ep-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(185px, 1fr));
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .ep-tab {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      position: relative;
    }

    .ep-tab:hover {
      border-color: #a5b4fc;
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .ep-tab.active {
      border-color: var(--primary);
      background: linear-gradient(180deg, #eef2ff 0%, #ffffff 100%);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.14);
    }

    .ep-tab-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary);
    }

    .ep-done-dot {
      font-size: 11px;
      color: var(--emerald);
      background: var(--emerald-soft);
      padding: 1px 6px;
      border-radius: 99px;
      font-weight: 700;
    }

    .ep-tab-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ep-tab-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .classroom-grid {
      max-width: 1440px;
      margin: 14px auto 24px;
      padding: 0 18px;
      display: grid;
      grid-template-columns: minmax(0, 1.34fr) minmax(360px, 1fr);
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 1060px) {
      .classroom-grid { grid-template-columns: 1fr; }
      .ep-strip { grid-template-columns: repeat(6, 220px); }
    }

    .blackboard-pane {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ep-hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
    }

    .ep-hero-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .ep-hero-title {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
    }

    .ep-hero-en {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .ep-goal-box {
      background: var(--bg-subtle);
      border-left: 3.5px solid var(--primary);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 13.5px;
      color: var(--text-sec);
      margin-bottom: 10px;
    }

    .term-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .term-chip {
      font-size: 12px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 3px 10px;
      color: #1e293b;
    }

    .term-chip b {
      color: var(--primary-dark);
      font-weight: 700;
    }

    .board-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
      position: relative;
    }

    .board-card.is-active-board {
      border-color: var(--primary);
      box-shadow: 0 10px 28px rgba(79, 70, 229, 0.14);
      background: #ffffff;
    }

    .board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .board-tag-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .board-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      background: #e2e8f0;
      color: #334155;
    }

    .board-card.is-active-board .board-tag {
      background: var(--primary);
      color: #ffffff;
    }

    .live-pill {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--emerald);
      background: var(--emerald-soft);
      border: 1px solid #a7f3d0;
      padding: 2px 8px;
      border-radius: 999px;
      animation: pulseGlow 1.8s infinite;
    }

    .board-card.is-active-board .live-pill {
      display: inline-flex;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.68; }
    }

    .board-jump-btn {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .board-jump-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .board-title {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
    }

    .board-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 720px) {
      .board-grid-2 { grid-template-columns: 1fr; }
    }

    .b-box {
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
    }

    .b-amber { background: #fffbeb; border-color: #fde68a; }
    .b-blue  { background: #eff6ff; border-color: #bfdbfe; }
    .b-rose  { background: #fff1f2; border-color: #fecdd3; }
    .b-teal  { background: #f0fdfa; border-color: #99f6e4; }

    .b-box-title {
      font-size: 13.5px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .b-eq {
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 8px;
      padding: 8px 11px;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 7px;
      overflow-x: auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .b-points {
      margin: 6px 0 0;
      padding-left: 18px;
      font-size: 13px;
      color: var(--text-sec);
    }

    .b-points li { margin-bottom: 4px; }

    .b-quote {
      background: linear-gradient(90deg, #eef2ff, #f8fafc);
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 0 10px 10px 0;
      margin-bottom: 10px;
    }

    .b-quote-en {
      font-size: 13.3px;
      color: #1e3a8a;
      margin-bottom: 5px;
      line-height: 1.6;
    }

    .b-quote-zh {
      font-size: 13px;
      color: #0f172a;
    }

    .b-scheme {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 10px;
      padding: 11px 14px;
      overflow-x: auto;
      margin-bottom: 8px;
    }

    .b-scheme pre {
      margin: 0;
      font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
      font-size: 12.5px;
      line-height: 1.54;
      color: #e2e8f0;
    }

    .b-mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.8px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    .b-mini-table th {
      background: #f1f5f9;
      color: #0f172a;
      font-weight: 700;
      text-align: left;
      padding: 8px 10px;
      border: 1px solid var(--border);
    }

    .b-mini-table td {
      padding: 8px 10px;
      border: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-sec);
    }

    .b-note {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12.8px;
      color: #92400e;
    }

    .b-tip-text {
      margin: 0;
      font-size: 13px;
      color: var(--text-sec);
    }

    .board-svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    code {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 0.92em;
      background: rgba(15, 23, 42, 0.06);
      padding: 1px 5px;
      border-radius: 4px;
      color: #be123c;
    }

    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
    }

    .quiz-head {
      font-size: 15.5px;
      font-weight: 800;
      margin: 0 0 12px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .q-item {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
    }

    .q-item:first-of-type {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }

    .q-stem {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .q-opts {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .q-opt-btn {
      text-align: left;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      font-size: 13.5px;
      color: var(--text-sec);
      cursor: pointer;
      transition: all 0.15s;
    }

    .q-opt-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .q-opt-btn.correct {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #065f46;
      font-weight: 700;
    }

    .q-opt-btn.wrong {
      background: var(--rose-soft);
      border-color: var(--rose);
      color: #9f1239;
    }

    .q-exp {
      display: none;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      font-size: 13px;
      color: #166534;
    }

    /* Right Pane: Single-Teacher Structured Lecture Stream */
    .transcript-pane {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 72px;
      max-height: calc(100vh - 184px);
    }

    @media (max-width: 1060px) {
      .transcript-pane {
        position: static;
        max-height: none;
      }
    }

    .transcript-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .transcript-title {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-main);
    }

    .auto-scroll-btn {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-sec);
      cursor: pointer;
    }

    .auto-scroll-btn.on {
      background: var(--primary-soft);
      border-color: #a5b4fc;
      color: var(--primary-dark);
    }

    .transcript-list {
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .turn-bubble {
      border-radius: 12px;
      padding: 11px 13px;
      border: 1.5px solid #e2e8f0;
      border-left-width: 4px;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
    }

    .turn-bubble.role-concept { border-left-color: #4f46e5; }
    .turn-bubble.role-example { border-left-color: #0d9488; background: #f8fdfa; }
    .turn-bubble.role-trap    { border-left-color: #e11d48; background: #fff9fa; }
    .turn-bubble.role-summary { border-left-color: #059669; background: #f6fef9; }

    .turn-bubble:hover {
      border-color: #a5b4fc;
      transform: translateX(1px);
    }

    .turn-bubble.active-turn {
      background: #eef2ff;
      border-color: var(--primary);
      border-left-width: 4.5px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.14);
    }

    .turn-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .speaker-name {
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--primary-dark);
    }

    .role-trap .speaker-name { color: #be123c; }
    .role-example .speaker-name { color: #0f766e; }
    .role-summary .speaker-name { color: #047857; }

    .turn-time {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e2e8f0;
      padding: 1px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .turn-text {
      font-size: 14px;
      line-height: 1.64;
      color: var(--text-main);
    }

    /* Sticky Bottom Audio Dock */
    .audio-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 120;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      color: #f8fafc;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 20px 12px;
      box-shadow: 0 -8px 28px rgba(15, 23, 42, 0.25);
    }

    .dock-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-lbl {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 12px;
      color: #cbd5e1;
      min-width: 44px;
    }

    .scrubber-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    #seek-slider {
      width: 100%;
      accent-color: #818cf8;
      cursor: pointer;
      height: 6px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ctrl-left, .ctrl-center, .ctrl-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .now-playing-label {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      max-width: 360px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .play-main-btn {
      background: #818cf8;
      color: #0f172a;
      border: none;
      border-radius: 999px;
      padding: 7px 20px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(129, 140, 248, 0.4);
    }

    .play-main-btn:hover {
      background: #a5b4fc;
    }

    .speed-select {
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .speed-select option {
      color: #0f172a;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">
      <div class="brand-badge">U29</div>
      <div>
        <div class="brand-title">Unit 29 碳化合物的命名及物理性质 · 双语有声互动预习课</div>
        <div class="brand-sub">HKDSE 精工版《Mastering Chemistry》Book 3B · 陈老师沉稳主讲 + 动态声画同步黑板</div>
      </div>
    </div>
    <div class="top-actions">
