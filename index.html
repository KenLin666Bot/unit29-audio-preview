        companionLink.href = 'https://kenlin666bot.github.io/mastering-organic-chem/';
        handoutMdLink.href = 'https://github.com/KenLin666Bot/unit29-audio-preview/blob/main/Unit29_%E5%8F%8C%E8%AF%AD%E8%AF%BE%E5%A0%82%E8%AE%B2%E4%B9%89%E4%B8%8E%E9%80%90%E5%AD%97%E7%A8%BF.md';
        document.querySelectorAll('.unit-jump-link').forEach(a => {
          const gh = a.getAttribute('data-gh');
          if (gh) a.href = gh;
        });
      }

      let isDraggingSlider = false;
      let activeTurnIdx = -1;
      let activeBoardId = null;

      function fmtTime(sec) {
        if (!isFinite(sec) || sec < 0) sec = 0;
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            currentEpIdx: state.currentEpIdx,
            doneEps: state.doneEps,
            speed: state.speed
          }));
        } catch (e) {}
      }

      downloadMerged.href = encodeURI(data.mergedAudioFile);
      totalDurBadge.textContent = fmtTime(data.totalDuration);
      speedSelect.value = String(state.speed);

      function renderEpisodeStrip() {
        epStrip.innerHTML = episodes.map((ep, idx) => {
          const isDone = !!state.doneEps[ep.id];
          const activeCls = idx === state.currentEpIdx ? 'active' : '';
          return `
            <button class="ep-tab ${activeCls}" data-ep-idx="${idx}">
              <div class="ep-tab-top">
                <span>${ep.epNum} · ${ep.code}</span>
                ${isDone ? '<span class="ep-done-dot">✓ 已学完</span>' : ''}
              </div>
              <div class="ep-tab-title">${ep.titleZh}</div>
              <div class="ep-tab-meta">
                <span>🎧 约 ${fmtTime(ep.duration)}</span>
                <span>${ep.boards.length} 张板书</span>
              </div>
            </button>
          `;
        }).join('');

        epStrip.querySelectorAll('.ep-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-ep-idx'));
            loadEpisode(idx, true);
          });
        });
      }

      function loadEpisode(idx, autoPlay) {
        state.currentEpIdx = idx;
        activeTurnIdx = -1;
        activeBoardId = null;
        saveState();
        renderEpisodeStrip();

        const ep = episodes[idx];

        epHero.innerHTML = `
          <div class="ep-hero-kicker">
            <span>📚 Mastering Chemistry · Unit 29</span>
            <span>|</span>
            <span>${ep.epNum}（课本 ${ep.code}）</span>
          </div>
          <h1 class="ep-hero-title">${ep.titleZh}</h1>
          <div class="ep-hero-en">${ep.titleEn}</div>
          <div class="ep-goal-box">🎯 <strong>本讲预习目标：</strong>${ep.goal}</div>
          <div class="term-row">
            ${ep.keyTerms.map(t => `<span class="term-chip"><b>${t.en}</b> · ${t.zh}</span>`).join('')}
          </div>
        `;

        boardsContainer.innerHTML = ep.boards.map((b, bIdx) => `
          <section class="board-card ${bIdx === 0 ? 'is-active-board' : ''}" id="card-${b.id}" data-board-id="${b.id}">
            <div class="board-head">
              <div class="board-tag-wrap">
                <span class="board-tag">${b.tag}</span>
                <span class="live-pill">● 正在讲授此板书</span>
              </div>
              <button class="board-jump-btn" data-jump="${b.start}">▶ 跳到此板书 (${fmtTime(b.start)})</button>
            </div>
            <h2 class="board-title">${b.title}</h2>
            <div class="board-body">${b.html}</div>
          </section>
        `).join('');

        boardsContainer.querySelectorAll('.board-jump-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const t = parseFloat(btn.getAttribute('data-jump') || '0');
            seekAndPlay(t);
          });
        });

        transcriptList.innerHTML = ep.turns.map((t, tIdx) => `
          <div class="turn-bubble role-${t.role || 'concept'}" id="turn-${tIdx}" data-turn-idx="${tIdx}" data-start="${t.start}">
            <div class="turn-meta">
              <span class="speaker-name">${t.stepTag}</span>
              <span class="turn-time">${fmtTime(t.start)}</span>
            </div>
            <div class="turn-text">${t.displayHtml}</div>
          </div>
        `).join('');

        transcriptList.querySelectorAll('.turn-bubble').forEach(div => {
          div.addEventListener('click', () => {
            const t = parseFloat(div.getAttribute('data-start') || '0');
            seekAndPlay(t);
          });
        });

        quizContainer.innerHTML = `
          <h3 class="quiz-head">⚡ 听完测一测：30 秒预习快问快答</h3>
          ${ep.quickChecks.map((q, qIdx) => `
            <div class="q-item" data-q-idx="${qIdx}">
              <div class="q-stem">${qIdx + 1}. ${q.q}</div>
              <div class="q-opts">
                ${q.options.map((opt, oIdx) => `
                  <button class="q-opt-btn" data-q="${qIdx}" data-o="${oIdx}">${opt}</button>
                `).join('')}
              </div>
              <div class="q-exp" id="q-exp-${qIdx}">💡 <strong>解析：</strong>${q.exp}</div>
            </div>
          `).join('')}
        `;

        quizContainer.querySelectorAll('.q-opt-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const qIdx = Number(btn.getAttribute('data-q'));
            const oIdx = Number(btn.getAttribute('data-o'));
            const qObj = ep.quickChecks[qIdx];
            const parent = btn.closest('.q-item');
            parent.querySelectorAll('.q-opt-btn').forEach((b, i) => {
              b.classList.remove('correct', 'wrong');
              if (i === qObj.ans) b.classList.add('correct');
            });
            if (oIdx !== qObj.ans) btn.classList.add('wrong');
            document.getElementById(`q-exp-${qIdx}`).style.display = 'block';
          });
        });

        audio.src = encodeURI(ep.audioFile);
        audio.playbackRate = state.speed;
        downloadEp.href = encodeURI(ep.audioFile);
        dockEpLabel.textContent = `${ep.epNum} (${ep.code}) · ${ep.titleZh}`;
        seekSlider.max = String(ep.duration);
        seekSlider.value = '0';
        curTimeEl.textContent = '00:00';
        durTimeEl.textContent = fmtTime(ep.duration);

        if (autoPlay) {
          audio.play().catch(() => {});
        } else {
          playBtn.textContent = '▶ 开始听课';
        }
      }

      function seekAndPlay(targetSec) {
        if (audio.readyState >= 1) {
          audio.currentTime = targetSec;
          audio.play().catch(() => {});
        } else {
          audio.addEventListener('loadedmetadata', function onMeta() {
            audio.removeEventListener('loadedmetadata', onMeta);
            audio.currentTime = targetSec;
            audio.play().catch(() => {});
          });
          audio.load();
        }
      }

      function syncClassroomHighlight(t) {
        const ep = episodes[state.currentEpIdx];
        if (!ep) return;

        let foundIdx = -1;
        for (let i = 0; i < ep.turns.length; i++) {
          const turn = ep.turns[i];
          const nextStart = (i + 1 < ep.turns.length) ? ep.turns[i + 1].start : ep.duration + 1;
          if (t >= turn.start - 0.08 && t < nextStart) {
            foundIdx = i;
            break;
          }
        }

        if (foundIdx !== -1 && foundIdx !== activeTurnIdx) {
          activeTurnIdx = foundIdx;
          transcriptList.querySelectorAll('.turn-bubble').forEach((el, i) => {
            el.classList.toggle('active-turn', i === foundIdx);
          });
          const activeTurnEl = document.getElementById(`turn-${foundIdx}`);
          if (activeTurnEl && state.autoScroll) {
            activeTurnEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }

          const targetBoardId = ep.turns[foundIdx].boardId;
          if (targetBoardId && targetBoardId !== activeBoardId) {
            const prevBoard = activeBoardId;
            activeBoardId = targetBoardId;
            boardsContainer.querySelectorAll('.board-card').forEach(card => {
              card.classList.toggle('is-active-board', card.getAttribute('data-board-id') === targetBoardId);
            });
            if (prevBoard !== null && state.autoScroll) {
              const cardEl = document.getElementById(`card-${targetBoardId}`);
              if (cardEl) {
                const y = cardEl.getBoundingClientRect().top + window.scrollY - 82;
                window.scrollTo({ top: y, behavior: 'smooth' });
              }
            }
          }
        }
      }

      audio.addEventListener('timeupdate', () => {
        const t = audio.currentTime;
        if (!isDraggingSlider) {
          seekSlider.value = String(t);
        }
        curTimeEl.textContent = fmtTime(t);
        syncClassroomHighlight(t);
      });

      audio.addEventListener('loadedmetadata', () => {
        if (audio.duration && isFinite(audio.duration)) {
          seekSlider.max = String(audio.duration);
          durTimeEl.textContent = fmtTime(audio.duration);
        }
        audio.playbackRate = state.speed;
      });

      audio.addEventListener('play', () => {
        playBtn.textContent = '⏸ 暂停';
      });

      audio.addEventListener('pause', () => {
        playBtn.textContent = '▶ 继续听课';
      });

      audio.addEventListener('ended', () => {
        const ep = episodes[state.currentEpIdx];
        state.doneEps[ep.id] = true;
        saveState();
        renderEpisodeStrip();
        if (state.autoPlayNext && state.currentEpIdx + 1 < episodes.length) {
          loadEpisode(state.currentEpIdx + 1, true);
        } else {
          playBtn.textContent = '↺ 重听本讲';
        }
      });

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play().catch(() => {});
        } else {
          audio.pause();
        }
      });

      document.getElementById('rew-btn').addEventListener('click', () => {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
      });

      document.getElementById('fwd-btn').addEventListener('click', () => {
        audio.currentTime = Math.min(audio.duration || 9999, audio.currentTime + 10);
      });

      document.getElementById('prev-ep-btn').addEventListener('click', () => {
        if (state.currentEpIdx > 0) loadEpisode(state.currentEpIdx - 1, !audio.paused);
      });

      document.getElementById('next-ep-btn').addEventListener('click', () => {
        if (state.currentEpIdx + 1 < episodes.length) loadEpisode(state.currentEpIdx + 1, !audio.paused);
      });

      seekSlider.addEventListener('input', () => {
        isDraggingSlider = true;
        curTimeEl.textContent = fmtTime(parseFloat(seekSlider.value));
      });

      seekSlider.addEventListener('change', () => {
        audio.currentTime = parseFloat(seekSlider.value);
        isDraggingSlider = false;
      });

      speedSelect.addEventListener('change', () => {
        state.speed = parseFloat(speedSelect.value);
        audio.playbackRate = state.speed;
        saveState();
      });

      autoScrollBtn.addEventListener('click', () => {
        state.autoScroll = !state.autoScroll;
        autoScrollBtn.classList.toggle('on', state.autoScroll);
        autoScrollBtn.textContent = state.autoScroll ? '🎯 自动跟随：开' : '🎯 自动跟随：关';
      });

      autoplayBtn.addEventListener('click', () => {
        state.autoPlayNext = !state.autoPlayNext;
        autoplayBtn.textContent = state.autoPlayNext ? '🔁 连播：开' : '🔁 连播：关';
      });

      document.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
        if (e.code === 'Space') {
          e.preventDefault();
          playBtn.click();
        } else if (e.code === 'ArrowLeft') {
          audio.currentTime = Math.max(0, audio.currentTime - 5);
        } else if (e.code === 'ArrowRight') {
          audio.currentTime = Math.min(audio.duration || 9999, audio.currentTime + 5);
        }
      });

      loadEpisode(state.currentEpIdx, false);
    })();
  </script>
</body>
</html>
